[package]
name = "quarc-notes"
version = "0.1.0"
description = "Quarc Notes desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# "Export" opens a native Save-as dialog and writes the file the person picked.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# cookie 0.18.1 uses the old 1-arg parse() API; time 0.3.52 changed it to 2 args.
# Pin below the break until Tauri pulls in a fixed cookie version.
time = { version = ">=0.3, <0.3.52" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Quarc Store single sign-on: the login the Store leaves for this app is protected for this Windows user (DPAPI).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
