<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Quarc Notes</title>
    <script>
      // Apply the saved theme before the first paint (no white flash in dark
      // mode). Same logic as applyTheme() in src/store/settingsStore.js.
      try {
        var s = JSON.parse(localStorage.getItem('quarc_notes_settings') || '{}');
        var t = s.theme || 'system';
        var d = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        if (d) r.classList.add('dark');
        r.style.colorScheme = d ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', d ? '#171717' : '#fafafa');
        r.lang = localStorage.getItem('language') || 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
